:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#edf2fa;background:#0c1422;font-size:15px}*{box-sizing:border-box}body{margin:0;padding-bottom:95px}header{background:linear-gradient(125deg,#142b43,#122032 70%);padding:25px 19px 19px;border-bottom:1px solid #263953}h1{margin:0;font-size:26px;letter-spacing:-.5px}h2{margin:0 0 12px;font-size:19px}h3{font-size:15px;margin:4px 0 9px}.muted,small{color:#a8bacd}.shell{max-width:750px;margin:auto}.subtitle{color:#aebed1;margin:5px 0 0}.main{padding:18px 16px}.card{background:#172436;border:1px solid #2b3b50;border-radius:16px;padding:17px;margin-bottom:14px}.mini{font-size:12px;color:#a8bacd}.statgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat{background:#202f44;padding:13px;border-radius:12px}.stat b{display:block;font-size:21px;margin:7px 0;color:white}.pill{display:inline-block;background:#214739;color:#a3ebc5;padding:5px 9px;border-radius:100px;font-size:12px;font-weight:700}.row{display:flex;gap:9px;align-items:center}.spread{justify-content:space-between}.stack{display:grid;gap:9px}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}input,select,textarea{width:100%;min-width:0;background:#0d1829;border:1px solid #3b5068;color:white;border-radius:10px;padding:12px;font:inherit}label{font-size:12px;color:#bbcad9;display:block;margin-bottom:6px}button{border:0;background:#36c9a1;color:#08271f;padding:11px 13px;border-radius:10px;font-weight:750;cursor:pointer;font-size:14px}button.alt{background:#283b51;color:#e2f0ff}button.danger{background:#562a37;color:#ffd9df}button.outline{background:transparent;color:#91ead0;border:1px solid #376e64}.tabs{position:fixed;bottom:0;left:0;right:0;background:#111e2e;border-top:1px solid #324057;display:flex;justify-content:center;padding:8px 4px max(10px,env(safe-area-inset-bottom));z-index:10}.tabs>div{display:grid;grid-template-columns:repeat(6,1fr);width:min(750px,100%);gap:3px}.tab{background:transparent;color:#98afc4;font-weight:500;font-size:11px;padding:8px 2px}.tab.active{color:#50deb4;background:#1d3642}.tab span{display:block;font-size:20px;margin-bottom:3px}.bar{background:#0d1829;border-radius:100px;height:9px;overflow:hidden;margin-top:9px}.bar>i{display:block;background:#36c9a1;height:100%;max-width:100%}.entry{padding:12px 0;border-bottom:1px solid #2e4056}.entry:last-child{border:0}.entryname{font-weight:700}.sets{display:grid;grid-template-columns:1fr 70px 70px auto;gap:6px;align-items:end;margin:7px 0}.sets input{padding:8px}.sets label{margin:0 0 3px}.circle{height:85px;width:85px;border:8px solid #254b43;border-top-color:#3fe2b1;border-radius:50%;display:grid;place-content:center;text-align:center}.progress{width:100%;height:130px}.progress polyline{fill:none;stroke:#37d6a4;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.progress circle{fill:#36c9a1}.toast{position:fixed;bottom:92px;left:50%;transform:translateX(-50%);background:#335c51;color:white;padding:12px 19px;border-radius:15px;z-index:11;display:none}.help{font-size:12px;color:#a6b8c8;line-height:1.5}.menu{display:flex;gap:7px;overflow-x:auto;padding-bottom:10px}.menu button{white-space:nowrap}.menu button.selected{background:#36c9a1;color:#0c2823}.hide{display:none!important}@media(min-width:650px){.statgrid{grid-template-columns:repeat(4,1fr)}}

:root{color:#dfedff;background:#050b19;font-family:system-ui,-apple-system,sans-serif}body{background:radial-gradient(ellipse at 80% -5%,#163361 0%,transparent 42%),#050b19}header{background:linear-gradient(125deg,#071327,#101b39 72%,#070d20);border-bottom:1px solid #4c78be;box-shadow:0 4px 34px #245de019;padding:22px 19px 20px}.main{padding-top:17px}.card{background:linear-gradient(145deg,#101d36,#0b162d);border:1px solid #294772;border-radius:12px;box-shadow:inset 0 1px #ffffff06,0 7px 24px #0005}.stat{background:#0b1931;border:1px solid #28436b;border-radius:8px}.stat b{color:#e7f5ff}.pill{background:#102c55;border:1px solid #3e8bdb;color:#7bdcff;letter-spacing:1.5px;border-radius:4px}.subtitle{color:#9cb7d9}button{background:linear-gradient(120deg,#2597db,#5d55db);color:#fff;border:1px solid #6dabf3;border-radius:7px;box-shadow:0 0 12px #386de52a}button.alt{background:#162542;color:#c7ddfb;border-color:#38577e}button.outline{color:#7bdcff;border-color:#32659d}.tabs{background:#080e22f5;border-top:1px solid #35558b;backdrop-filter:blur(12px)}.tab.active{color:#8feaff;background:#11274c}.tab{color:#98a9c9}.bar{background:#061024}.bar>i{background:linear-gradient(90deg,#3075eb,#69ddff)}.progress polyline{stroke:#66dfff}.progress circle{fill:#66dfff}input,select,textarea{background:#07152d;border:1px solid #33517d}input:focus{outline:1px solid #5fbbed} .toast{background:#123d67;border:1px solid #5cafff}.menu button.selected{background:#2454ae;color:#fff}.entry{border-color:#274266}
.system-title{font-size:11px;color:#63ceff;letter-spacing:3px;font-weight:800;margin-bottom:6px}.system-banner{position:relative;overflow:hidden;background:radial-gradient(ellipse at 83% 5%,#244ba180,transparent 55%),linear-gradient(125deg,#101c42,#080f24);border:1px solid #4a77b7;border-radius:12px;padding:20px;box-shadow:0 0 35px #234ccd2a;margin-bottom:14px}.system-banner:after{content:'✦';position:absolute;right:16px;top:14px;font-size:80px;color:#6caafa21}.biglevel{font-size:55px;font-weight:900;line-height:1;letter-spacing:-2px;color:#f1f8ff;text-shadow:0 0 20px #4188fd5c}.rank{font-size:12px;letter-spacing:2px;color:#a7e8ff;font-weight:800}.quest{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #284061}.quest:last-child{border:0}.questicon{height:38px;width:38px;display:grid;place-items:center;background:#162e54;border:1px solid #355f99;color:#93dcff;border-radius:7px;flex-shrink:0;font-size:20px}.questicon.done{border-color:#2d9c9c;background:#0c393d;color:#99fff2}.questname{font-weight:700;font-size:14px}.questnote{font-size:12px;color:#a8b9d2;margin-top:3px}.xp{color:#6ee4ff;font-size:12px;font-weight:800;white-space:nowrap}.logline{font-family:ui-monospace,monospace;font-size:12px;letter-spacing:.3px;color:#93b8e8}.system-heading{font-size:13px;letter-spacing:1.5px;color:#81caff;text-transform:uppercase;margin-bottom:12px}.tinyline{font-size:11px;color:#9bb4d3}.achievement{display:flex;gap:12px;align-items:center;padding:10px;border:1px solid #2d4a73;background:#0b1931;border-radius:9px;margin:8px 0}.achievement.locked{opacity:.43;filter:grayscale(.75)}.achicon{font-size:26px} .rankmark{display:inline-flex;align-items:center;justify-content:center;width:35px;height:35px;border:1px solid #7ab6ff;background:#163b74;color:#beebff;font-weight:900;font-size:20px;clip-path:polygon(50% 0,95% 25%,95% 75%,50% 100%,5% 75%,5% 25%)}
</style></head><body><div class="shell"><header><div class="row spread"><div><span class="pill">THE SYSTEM IS ONLINE</span><h1 style="font-size:27px;letter-spacing:2px;margin-top:9px">ASCENSION<span style="color:#7de6ff">.</span></h1><p class="subtitle">Your evolution is earned, one quest at a time.</p></div><div class="rankmark">E</div></div></header><main class="main" id="app"></main></div><nav class="tabs"><div id="tabs"></div></nav><div id="toast" class="toast"></div><script>
const KEY='recomp-tracker-v1';const goalDefault={calories:3000,protein:200,carbs:350,fat:89,steps:8000,water:3};const workouts=[{name:'Upper A',day:'Monday',ex:[['Bench press','3 × 6–8'],['Lat pulldown','3 × 8–10'],['Incline dumbbell press','3 × 8–10'],['Chest-supported row','3 × 8–12'],['Dumbbell lateral raises','3 × 12–15'],['Rope triceps pushdown','2 × 10–15'],['Dumbbell curls','2 × 10–15']]},{name:'Lower A',day:'Tuesday',ex:[['Squat or hack squat','3 × 6–10'],['Romanian deadlift','3 × 8–10'],['Leg press','3 × 10–12'],['Seated leg curl','3 × 10–15'],['Standing calf raises','3 × 12–15'],['Cable crunch','3 × 12–15']]},{name:'Upper B',day:'Thursday',ex:[['Assisted pull-up / pulldown','3 × 8–12'],['Incline machine chest press','3 × 8–12'],['Seated cable row','3 × 10–12'],['Dumbbell shoulder press','3 × 8–12'],['Cable lateral raises','2 × 12–20'],['Reverse pec deck','3 × 12–15'],['Hammer curls','3 × 10–12'],['Overhead triceps extension','3 × 10–12']]},{name:'Lower B',day:'Friday',ex:[['Hack squat or front squat','3 × 8–10'],['Hip thrust','3 × 8–12'],['Lying leg curl','3 × 10–12'],['Leg extension','3 × 12–15'],['Seated calf raises','3 × 12–15'],['Lying leg raises','3 × 10–15'],['Weighted plank','3 × 30–45 sec']]},{name:'Optional Arms',day:'Saturday',ex:[['Cable lateral raises','3 × 12–15'],['Rear-delt fly','3 × 12–15'],['EZ-bar curls','3 × 10–12'],['Cable triceps pushdown','3 × 10–12'],['Incline dumbbell curls','2 × 12–15'],['Overhead triceps extensions','2 × 12–15'],['Easy incline walk','15–20 min']]}];
const days=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];const iso=()=>{let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let db;try{db=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){db={}}db={goals:{...goalDefault,...(db.goals||{})},food:db.food||[],weights:db.weights||[],workouts:db.workouts||[],habits:db.habits||{},...db};db.inventory=db.inventory||{};let page='home', workoutSel=0, foodDate=iso(),weightDate=iso(),runSets={};function persist(){localStorage.setItem(KEY,JSON.stringify(db));}function flash(s){let t=document.getElementById('toast');t.textContent=s;t.style.display='block';setTimeout(()=>t.style.display='none',2100)}function sum(d){return db.food.filter(f=>f.date===d).reduce((a,f)=>{['calories','protein','carbs','fat'].forEach(k=>a[k]+=Number(f[k]||0));return a},{calories:0,protein:0,carbs:0,fat:0})}function nav(p){page=p;render()}function val(id){return document.getElementById(id).value}function n(id){return Number(val(id))||0}function metric(name,val,unit,goal){return `<div class="stat"><small>${name}</small><b>${Number(val).toLocaleString()}${unit?' '+unit:''}</b><small>${goal?'Target '+goal+unit:''}</small>${goal?`<div class="bar"><i style="width:${Math.min(100,100*val/goal)}%"></i></div>`:''}</div>`}function header(s){return `<h2>${s}</h2>`}function rankName(level){return level>=50?'S':level>=35?'A':level>=23?'B':level>=13?'C':level>=6?'D':'E'}
function systemStats(){let dates=new Set(db.workouts.map(w=>w.date+'-'+w.name));let workoutXP=dates.size*150;let foodDates=[...new Set(db.food.map(f=>f.date))];let foodXP=foodDates.reduce((n,d)=>n+(sum(d).protein>=db.goals.protein?75:0),0);let habitsXP=Object.values(db.habits).reduce((a,h)=>a+(Number(h.steps)>=db.goals.steps?40:0)+(Number(h.water)>=db.goals.water?25:0)+(h.creatine?10:0),0);let measureXP=db.weights.length*50;let xp=workoutXP+foodXP+habitsXP+measureXP;let level=1,spent=0;while(xp-spent>=100+level*45){spent+=100+level*45;level++}return {xp,level,within:xp-spent,next:100+level*45,rank:rankName(level),sessions:db.workouts.length}} 
function questData(){let t=iso(),sumToday=sum(t),h=db.habits[t]||{},doneWorkout=db.workouts.some(w=>w.date===t);let quests=[{icon:'⚔',name:'Complete a training session',desc:'Record a workout with at least one working set',xp:150,done:doneWorkout,target:'gym'},{icon:'◈',name:'Fuel your growth',desc:'Reach your daily protein target',xp:75,done:sumToday.protein>=db.goals.protein,target:'food'},{icon:'↟',name:'Walk the path',desc:`Reach ${Number(db.goals.steps).toLocaleString()} steps`,xp:40,done:Number(h.steps)>=db.goals.steps,target:'home'},{icon:'◉',name:'Stay hydrated',desc:`Log ${db.goals.water} L of water`,xp:25,done:Number(h.water)>=db.goals.water,target:'home'},{icon:'✧',name:'Daily supplement habit',desc:'Mark creatine taken (optional)',xp:10,done:!!h.creatine,target:'home'}];return quests}
function systemPanel(){let a=systemStats(),q=questData(),done=q.filter(x=>x.done).length;let unlocks=[['First Awakening','Log your first completed workout',db.workouts.length>=1,'⚔'],['Unbreakable','Complete 10 workouts',db.workouts.length>=10,'🛡'],['Iron Will','Complete 25 workouts',db.workouts.length>=25,'◆'],['The Transformation','Log 12 body check-ins',db.weights.length>=12,'✦']];return `<div class="system-banner"><div class="system-title">PLAYER STATUS</div><div class="row spread" style="position:relative;z-index:1"><div><div class="rank">${a.rank}-RANK HUNTER</div><div class="row" style="align-items:baseline;gap:10px;margin-top:6px"><span class="biglevel">${a.level}</span><span style="color:#b7cceb;font-size:14px">LEVEL</span></div><div class="tinyline" style="margin-top:9px">${a.xp.toLocaleString()} TOTAL XP</div></div><div style="text-align:right"><div class="rankmark" style="height:58px;width:58px;font-size:30px">${a.rank}</div><div class="tinyline" style="margin-top:9px">${a.sessions} RAIDS CLEARED</div></div></div><div class="row spread" style="margin-top:17px"><span class="logline">EXPERIENCE</span><span class="logline">${a.within} / ${a.next} XP</span></div><div class="bar" style="height:12px"><i style="width:${100*a.within/a.next}%"></i></div></div><div class="card"><div class="row spread"><h2 class="system-heading" style="margin:0">Daily Quests</h2><span class="xp">${done}/${q.length} COMPLETE</span></div><p class="tinyline">Quests reset each day. Completing them earns experience.</p>${q.map(x=>`<div class="quest"><div class="questicon ${x.done?'done':''}">${x.done?'✓':x.icon}</div><div style="flex:1"><div class="questname">${x.name}</div><div class="questnote">${x.desc}</div></div><div style="text-align:right"><div class="xp">+${x.xp} XP</div>${!x.done?`<button class="alt" style="padding:5px 8px;font-size:11px;margin-top:6px" onclick="nav('${x.target}')">GO →</button>`:'<div class="tinyline">CLEARED</div>'}</div></div>`).join('')}</div><div class="card"><h2 class="system-heading">Titles & Achievements</h2>${unlocks.map(([name,desc,yes,icon])=>`<div class="achievement ${yes?'':'locked'}"><div class="achicon">${icon}</div><div><b>${name}</b><div class="questnote">${desc}</div></div><div style="margin-left:auto;color:#8cecff">${yes?'✓':'🔒'}</div></div>`).join('')}<p class="help">Ranks and titles reflect consistency in this app, not medical fitness or actual strength comparisons. No punishment for recovery days.</p></div>`}
function home(){const t=iso(),s=sum(t),h=db.habits[t]||{},w=db.weights.at(-1);let next=workouts.find(x=>x.day===days[new Date().getDay()]);return `${systemPanel()}${header('Today • '+new Date().toLocaleDateString('en-AU',{weekday:'long',day:'numeric',month:'short'}))}<div class="statgrid">${metric('Calories',s.calories,'',db.goals.calories)}${metric('Protein',s.protein,'g',db.goals.protein)}${metric('Carbs',s.carbs,'g',db.goals.carbs)}${metric('Fats',s.fat,'g',db.goals.fat)}</div><div class="card" style="margin-top:14px"><div class="row spread"><div><h2 style="margin:0">Your next session</h2><p class="subtitle">${next?next.name+' • '+next.day:'Rest / walk and mobility'}</p></div><button onclick="nav('gym')">Open gym →</button></div></div><div class="card"><h2>Daily habits</h2><div class="two"><div><label>Steps</label><input id="steps" type="number" min="0" value="${h.steps||''}" placeholder="${db.goals.steps}"></div><div><label>Water (litres)</label><input id="water" type="number" min="0" step=".1" value="${h.water||''}" placeholder="3.0"></div></div><div class="row" style="margin-top:11px"><label style="margin:0;flex:1"><input type="checkbox" id="creatine" ${h.creatine?'checked':''} style="width:auto"> Creatine taken</label><button onclick="saveHabits()">Save habits</button></div></div><div class="card"><h2>Latest check-in</h2><div class="statgrid">${metric('Bodyweight',w?.kg??110,'kg')}${metric('Waist',w?.waist||'—','cm')}</div><p class="help">Weigh in on several mornings weekly and compare averages. Waist decreases + better lifts can mean progress even if bodyweight stays flat.</p><button class="alt" onclick="nav('body')">Log measurement</button></div>`}
function saveHabits(){db.habits[iso()]={steps:n('steps'),water:n('water'),creatine:document.getElementById('creatine').checked};persist();flash('Habits saved');render()}
function food(){const s=sum(foodDate),items=db.food.filter(f=>f.date===foodDate);return `${header('Fuel & Nutrition')}<div class="card"><label>Log date</label><input type="date" value="${foodDate}" onchange="foodDate=this.value;render()"><div class="statgrid" style="margin-top:12px">${metric('Calories',s.calories,'',db.goals.calories)}${metric('Protein',s.protein,'g',db.goals.protein)}${metric('Carbs',s.carbs,'g',db.goals.carbs)}${metric('Fat',s.fat,'g',db.goals.fat)}</div></div><div class="card"><h2>Add a meal / food</h2><div class="stack"><div><label>Food or meal</label><input id="foodname" placeholder="e.g. chicken, rice and broccoli"></div><div class="two"><div><label>Calories (kcal)</label><input id="fc" type="number" min="0" placeholder="650"></div><div><label>Protein (g)</label><input id="fp" type="number" min="0" placeholder="55"></div><div><label>Carbs (g)</label><input id="fcarb" type="number" min="0" placeholder="70"></div><div><label>Fat (g)</label><input id="ff" type="number" min="0" placeholder="17"></div></div><button onclick="addFood()">+ Add food</button></div><p class="help">Enter nutrition values from the packaging or your food tracking calculations. This version doesn't automatically calculate calories from food names.</p></div><div class="card"><h2>Today's food</h2>${items.length?items.map(f=>`<div class="entry row spread"><div><div class="entryname">${safe(f.name)}</div><small>${f.calories} kcal · P ${f.protein} · C ${f.carbs} · F ${f.fat}</small></div><button class="danger" onclick="removeFood('${f.id}')">×</button></div>`).join(''):'<p class="muted">No meals logged yet.</p>'}</div>`}function addFood(){let name=val('foodname').trim();if(!name)return flash('Enter a food name');db.food.push({id:crypto.randomUUID(),date:foodDate,name,calories:n('fc'),protein:n('fp'),carbs:n('fcarb'),fat:n('ff')});persist();flash('Meal added');render()}function removeFood(id){db.food=db.food.filter(f=>f.id!==id);persist();render()}
function gym(){let w=workouts[workoutSel],history=db.workouts.filter(x=>x.name===w.name).slice(-1)[0];return `${header('Training Raids')}<div class="menu">${workouts.map((x,i)=>`<button class="${workoutSel===i?'selected':'alt'}" onclick="workoutSel=${i};runSets={};render()">${x.name}</button>`).join('')}</div><div class="card"><div class="row spread"><div><h2 style="margin:0">${w.name}</h2><p class="subtitle">${w.day} • ${w.ex.length} exercises</p></div><button class="alt" onclick="finishWorkout()">Finish & save</button></div><p class="help">Record weight (kg) and reps for each working set. Tap + Set for extra sets. Previous performance is displayed after a saved session. Your entries remain available until you finish the workout.</p></div>${w.ex.map(([name,rep],i)=>{let old=history?.sets?.filter(x=>x.exercise===name)||[],count=runSets[i]||parseInt(rep,10)||3;return `<div class="card"><h3>${safe(name)}</h3><div class="mini">Target ${rep}${old.length?' · Last: '+old.map(s=>s.kg+' kg × '+s.reps).join(', '):''}</div>${Array.from({length:count},(_,j)=>`<div class="sets"><div class="mini">Set ${j+1}</div><div><label>kg</label><input aria-label="kg" type="number" step=".5" min="0" id="kg-${i}-${j}" value="${safe(window.draft?.[`${i}-${j}`]?.kg??'')}"></div><div><label>reps</label><input aria-label="reps" type="number" min="0" id="reps-${i}-${j}" value="${safe(window.draft?.[`${i}-${j}`]?.reps??'')}"></div><button class="alt" onclick="clearSet(${i},${j})">×</button></div>`).join('')}<button class="outline" onclick="addSet(${i})">+ Set</button></div>`}).join('')}<div class="card"><button style="width:100%" onclick="finishWorkout()">✓ Finish and save workout</button></div><div class="card"><h2>Completed Raids</h2>${db.workouts.slice(-8).reverse().map(x=>`<div class="entry"><strong>${safe(x.name)}</strong> <span class="mini">${x.date} · ${x.sets.length} sets</span></div>`).join('')||'<p class="muted">Your completed workouts will appear here.</p>'}</div>`}
function preserveDraft(){window.draft=window.draft||{};let w=workouts[workoutSel];w.ex.forEach((_,i)=>{for(let j=0;j<(runSets[i]||parseInt(w.ex[i][1],10)||3);j++){let a=document.getElementById(`kg-${i}-${j}`),b=document.getElementById(`reps-${i}-${j}`);if(a&&b)window.draft[`${i}-${j}`]={kg:a.value,reps:b.value}}})}function addSet(i){preserveDraft();runSets[i]=(runSets[i]||parseInt(workouts[workoutSel].ex[i][1],10)||3)+1;render()}function clearSet(i,j){document.getElementById(`kg-${i}-${j}`).value='';document.getElementById(`reps-${i}-${j}`).value='';preserveDraft()}function finishWorkout(){preserveDraft();let sets=[];workouts[workoutSel].ex.forEach(([name],i)=>{for(let j=0;j<(runSets[i]||parseInt(workouts[workoutSel].ex[i][1],10)||3);j++){let s=window.draft?.[`${i}-${j}`];if(s&&s.kg!==''&&s.reps!==''&&Number(s.reps)>0)sets.push({exercise:name,kg:Number(s.kg),reps:Number(s.reps)})}});if(!sets.length)return flash('Enter at least one completed set');db.workouts.push({id:crypto.randomUUID(),name:workouts[workoutSel].name,date:iso(),sets});persist();window.draft={};runSets={};flash('Raid cleared • +150 XP');render()}
function spark(vals,field){if(vals.length<2)return '<p class="help">Add at least two check-ins to see a trend.</p>';let ar=vals.slice(-15),numbers=ar.map(x=>Number(x[field])).filter(x=>Number.isFinite(x)&&x>0);if(numbers.length<2)return '<p class="help">Add at least two measurements to see a trend.</p>';let lo=Math.min(...numbers)-1,hi=Math.max(...numbers)+1,pts=numbers.map((y,i)=>`${12+i* (320/Math.max(1,numbers.length-1))},${110-95*(y-lo)/(hi-lo)}`).join(' ');return `<svg viewBox="0 0 350 130" class="progress" role="img" aria-label="Trend chart"><line x1="10" y1="115" x2="345" y2="115" stroke="#536477"/><polyline points="${pts}"/></svg>`}

function settings(){return `${header('Goals & backups')}<div class="card"><h2>Daily nutrition goals</h2><div class="two">${[['calories','Calories (kcal)'],['protein','Protein (g)'],['carbs','Carbs (g)'],['fat','Fat (g)'],['steps','Steps'],['water','Water (litres)']].map(([k,label])=>`<div><label>${label}</label><input type="number" min="0" id="goal-${k}" value="${db.goals[k]}"></div>`).join('')}</div><button style="margin-top:12px;width:100%" onclick="saveGoals()">Save targets</button></div><div class="card"><h2>Back up your data</h2><p class="help">Your data is saved locally in this browser, not on an online account. It won't automatically sync between devices. Export a backup regularly, particularly before clearing browsing data or changing phones.</p><div class="stack"><button onclick="exportJSON()">↓ Export complete backup (.json)</button><button class="alt" onclick="exportCSV()">↓ Export workouts (.csv)</button><label for="importfile">Import backup (.json)</label><input id="importfile" type="file" accept="application/json,.json" onchange="importJSON(this)"></div></div><div class="card"><h2>About this plan</h2><p class="help">Initial 12-week goal: add strength and muscle while slowly reducing waist size. Calorie target is an estimate. After 2–3 weeks, adjust based on weight trend, waist measurements and lifting performance. The nutrition tracker is manual-entry only.</p></div>`}function saveGoals(){Object.keys(goalDefault).forEach(k=>db.goals[k]=n('goal-'+k));persist();flash('Goals updated');render()}function download(content,name,type){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type}));a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function exportJSON(){download(JSON.stringify(db,null,2),'recomp-backup-'+iso()+'.json','application/json')}function exportCSV(){let rows=[['Date','Session','Exercise','Weight kg','Reps']];db.workouts.forEach(w=>w.sets.forEach(s= function scaledMeal(m,factor){return {name:m[0],calories:Math.round(m[1]*factor),protein:Math.round(m[2]*factor),carbs:Math.round(m[3]*factor),fat:Math.round(m[4]*factor),description:m[5],ingredients:Object.fromEntries(Object.entries(m[6]).map(([k,v])=>[k,Math.round(v*factor*10)/10])),portion:factor};}
function planTotals(day){return day.reduce((a,m)=>{for(let key of ['calories','protein','carbs','fat'])a[key]+=m[key];return a},{calories:0,protein:0,carbs:0,fat:0})}
function makeMealPlan(){let targets=db.goals;let seed=(db.mealPlan?.seed||0)+1;let out=[];
 for(let d=0;d<7;d++){
  let meals=mealSlots.map(([slot,label],i)=>{let arr=pantry[slot];let choice=arr[(d*(i%2+1)+i+seed)%arr.length];return {...scaledMeal(choice,1),slot:label}});
  // Portion adjustment is bounded to stay meal-prep practical. Macros are estimates, not optimised clinical nutrition.
  let total=planTotals(meals);let mult=Math.max(.75,Math.min(1.25,(Number(targets.calories)||3000)/total.calories));
  meals=meals.map(m=>({...m,...{calories:Math.round(m.calories*mult),protein:Math.round(m.protein*mult),carbs:Math.round(m.carbs*mult),fat:Math.round(m.fat*mult),ingredients:Object.fromEntries(Object.entries(m.ingredients).map(([k,v])=>[k,Math.round(v*mult*10)/10])),portion:Math.round(mult*100)/100}}));
  out.push(meals);
 }
 db.mealPlan={days:out,seed,created:iso(),people:db.mealPlan?.people||1};persist();flash('7-day meal quest generated');render();
}

!==1?`<br><small>Portion factor ×${m.portion} — scale quantities below accordingly</small>`:''}</p><div class="mini">P ${m.protein}g • C ${m.carbs}g • F ${m.fat}g</div><details style="margin:10px 0"><summary class="mini">Ingredients / prep quantities</summary><p class="help">${Object.entries(m.ingredients).map(([k,v])=>`${safe(k)}: ${v}`).join(' • ')}</p></details><button class="outline" onclick="logPlannedMeal(${planDay},${i})">+ Log this meal today</button></div>`).join('')}<div class="card"><h2>7-day shopping list</h2><p class="help">Manage what you have and what you still need in the dedicated Inventory screen.</p><button class="alt" onclick="nav('inventory')">Open Inventory →</button><p class="help">Quantities below cover <b>one person's</b> seven-day plan. Change multiplier for household prep. They are planning estimates; check pack sizes before buying.</p><div class="two"><div><label>Shopping quantity multiplier</label><input id="shopping-people" type="number" min="1" max="12" step="1" value="${Number(pl.people)||1}" onchange="setShoppingPeople(this.value)"></div><div style="display:flex;align-items:end"><button class="alt" style="width:100%" onclick="copyShopping()">Copy shopping list</button></div></div><div style="margin-top:13px">${items.map(([k,v])=>`<div class="entry row spread"><span>${safe(k)}</span><b>${Math.round(v*(Number(pl.people)||1)*10)/10}</b></div>`).join('')}</div></div><div class="card"><h2>Batch-prep strategy</h2><p class="help">Cook rice, chicken and turkey in separate batches; portion into labelled containers. Refrigerate cooked leftovers promptly and use within 3–4 days, or freeze portions for later in the week. Keep sauces and salad separate. Cook fish near the day you intend to eat it or freeze it promptly.</p></div>`:`<div class="card"><h2>How it works</h2><p class="help">Generates breakfast, lunch, dinner and two snacks each day using family-friendly meals. Updates portions toward your calorie goal, produces ingredient totals and le ing: <span style="color:${remaining&&!done?'#80dfff':'#97f1b9'}">${remaining}</span></div></div><label style="display:flex;align-items:center;gap:5px;margin:0;color:#c4dcff"><input type="checkbox" style="width:20px" ${entry.bought?'checked':''} onchange="setBought(${JSON.stringify(name).replaceAll('"','&quot;')},this.checked)"> Bought</label></div><div class="row" style="margin-top:8px"><label style="flex:1;margin:0">Already have <input type="number" min="0" step="any" value="${have}" aria-label="Pantry quantity for ${safe(name)}" onchange="setStock(${JSON.stringify(name).replaceAll('"','&quot;')},this.value)"></label>${qty===0?`<button class="danger" onclick="removeInventory(${JSON.stringify(name).replaceAll('"','&quot;')})">Remove</button>`:''}</div></div>`}).join(''):'<p class="help">No items yet. Generate a meal plan or add an item above.</p>'}</div><div class="card"><h2>How it works</h2><p class="help">Your weekly shopping quantities come from Nutrition Oracle. Existing pantry amounts are subtracted automatically. Regenerating your meal plan will refresh requirements without erasing your stored pantry amounts or manually added items.</p></div>`}

function copyInventory(){let lines=neededItems().filter(({name,qty})=>qty>Number(getItem(name).have||0)&&!getItem(name).bought).map(({name,qty})=>name+': '+Math.round((qty-Number(getItem(name).have||0))*10)/10);let txt='ASCENSION — Shopping Quest\n'+(lines.join('\n')||'All planned items covered');if(navigator.clipboard?.writeText)navigator.clipboard.writeText(txt).then(()=>flash('Shopping list copied')).catch(()=>download(txt,'ascension-shopping.txt','text/plain'));else download(txt,'ascension-shopping.txt','text/plain')}

 return base+`\nCreate an affordable seven-day meal prep plan with five meals per day. Emphasise chicken with some beef and pork. All days should aim near my targets; grocery quantities must be calculated as summed ingredient amounts. Use consistent ingredient units in ingredient names, such as "Chicken breast (g)" and "Eggs (each)". Return ONLY a valid JSON object, without markdown or comments, in this EXACT structure: {"days":[[ {"slot":"Breakfast","name":"Meal title","description":"How to prepare","calories":600,"protein":40,"carbs":60,"fat":20,"ingredients":{"Eggs (each)":3,"Wholemeal bread (g)":80}}, {"slot":"Lunch","name":"...","description":"...","calories":600,"protein":40,"carbs":60,"fat":20,"ingredients":{}}, {"slot":"Snack 1","name":"...","description":"...","calories":300,"protein":25,"carbs":30,"fat":10,"ingredients":{}}, {"slot":"Dinner","name":"...","description":"...","calories":900,"protein":55,"carbs":110,"fat":25,"ingredients":{}}, {"slot":"Snack 2","name":"...","description":"...","calories":600,"protein":40,"carbs":90,"fat":14,"ingredients":{}} ], ... six more day-arrays of five meals each ]}. IMPORTANT: all 7 days fully populated, five meals/day, numerical macros and numeric ingredient quantities in matching units. No ingredient forbidden above. Verify each day's totals as closely as possible. No extra prose.`;
}
async function copyAIPrompt(){const str=aiPrompt();try{await navigator.clipboard.writeText(str);flash('Prompt copied — open ChatGPT')}catch(e){let field=document.getElementById('ai-manual-prompt');if(field){field.value=str;field.select();flash('Select and copy the prompt below')}}}
function openChat(){window.open('https://chatgpt.com/','_blank','noopener,noreferrer')}
function validMealPlan(parsed){
 if(!parsed||!Array.isArray(parsed.days)||parsed.days.length!==7)throw new Error('Expected exactly 7 days');
 const excluded=/\b(mushroom|mushrooms|zucchini|courgette|corn|sweetcorn)\b/i;
 const all=[];
 for(const [i,day] of parsed.days.entries()){
  if(!Array.isArray(day)||day.length!==5)throw new Error(`Day ${i+1} must have exactly 5 meals`);
  const checked=day.map((m,j)=>{
   if(!m||typeof m!=='object'||!m.name||!m.slot||!m.ingredients||typeof m.ingredients!=='object'||Array.isArray(m.ingredients))throw new Error(`Day ${i+1} meal ${j+1} incomplete`);
   let msg=[m.name,m.description,...Object.keys(m.ingredients)].join(' ');if(excluded.test(msg))throw new Error('A meal contains an excluded ingredient');
   const nums={};for(const k of ['calories','protein','carbs','fat']){let v=Number(m[k]);if(!Number.isFinite(v)||v<0||v>6000)throw new Error(`Invalid ${k} on day ${i+1}`);nums[k]=Math.round(v*10)/10}
   const ingredients={};for(const [name,amt] of Object.entries(m.ingredients)){let value=Number(amt);if(!name.trim()||!Number.isFinite(value)||value<0||value>100000)throw new Error('Invalid ingredient quantity');ingredients[name.slice(0,100)]=value}
   return {slot:String(m.slot).slice(0,32),name:String(m.name).slice(0,120),description:String(m.description||'').slice(0,700),...nums,ingredients,portion:1};
  });all.push(checked);
 }return all;
}
function importAIPlan(){let raw=val('ai-json').trim();try{let parsed=JSON.parse(raw.replace(/^```(?:json)?\s*/i,'').replace(/\s*```$/,''));let days=validMealPlan(parsed);if(!confirm('Replace your current seven-day meal plan? Existing food logs and pantry stock will remain.'))return;db.mealPlan={days,people:1,created:iso(),seed:(db.mealPlan?.seed||0)+1,source:'ChatGPT import'};persist();planDay=0;flash('AI plan imported! Shopping inventory updated.');nav('planner')}catch(e){flash('Import failed: '+e.message);document.getElementById('ai-error').textContent=e.message}}
function systemAI(){return `${header('SYSTEM AI')}<div class="system-banner"><div class="system-title">HUNTER INTELLIGENCE</div><h2>Your personal AI co-pilot</h2><p class="help">Private, no API key required. Send only what you choose to ChatGPT, then import a structured meal plan into ASCENSION. This is a manual connection, not live Sign in with ChatGPT.</p></div><div class="card"><h2>Choose a quest</h2><div class="row" style="flex-wrap:wrap">${[['meals','✧ Meal planner'],['workouts','⚔ Training analysis'],['progress','⌁ Progress review']].map(([k,label])=>`<button class="${aiMode===k?'':'alt'}" onclick="aiMode='${k}';render()">${label}</button>`).join('')}</div><p class="help">Your prompt includes relevant targets and selected app data, including pantry items for meal planning. Review it before sharing.</p><textarea id="ai-manual-prompt" rows="7" style="width:100%;min-height:130px">${safe(aiPrompt())}</textarea><div class="row" style="flex-wrap:wrap;margin-top:10px"><button onclick="copyAIPrompt()">1. Copy prompt</button><button class="alt" onclick="openChat()">2. Open ChatGPT ↗</button></div></div>${aiMode==='meals'?`<div class="card"><h2>3. Import your AI meal plan</h2><p class="help">Copy ChatGPT's JSON response into this box, then import it. We check that it contains seven days, five meals a day and numeric ingredient quantities. The meal planner and shopping inventory update together. This won't erase your logged workouts or foods.</p><textarea id="ai-json" rows="7" style="width:100%;min-height:150px" placeholder='Paste JSON response here: {"days":[...]}'></textarea><p id="ai-error" class="help" style="color:#ffb4b4"></p><button onclick="importAIPlan()">Import meal plan into ASCENSION →</button></div>`:`<div class="card"><h2>Return with your advice</h2><p class="help">ChatGPT's coaching suggestions aren't automatically applied to your gym log or targets. Review recommendations and make changes in Raids or Setup yourself.</p></div>`}<div class="card"><h2>Connection status</h2><p class="help">OFFLINE HANDOFF ACTIVE • Live ChatGPT-plan authentication has <b>not</b> been activated. It requires a supported registered client and the official authorisation flow. No ChatGPT password, token or API key is requested by this app.</p><p class="help">Your data stays in this browser unless you copy it into ChatGPT or export a backup. Data on the device is not encrypted by ASCENSION; use your iPhone passcode.</p><a href="https://developers.openai.com/siwc/quickstart" target="_blank" rel="noopener noreferrer">Official Sign in with ChatGPT setup guide ↗</a></div>`}

function render(){document.getElementById('tabs').innerHTML=[['home','◇','System'],['gym','⚔','Raids'],['food','◉','Fuel'],['planner','✧','Meals'],['inventory','▣','Items'],['ai','✦','AI'],['body','⌁','Status'],['settings','⚙','Setup']].map(([p,icon,label])=>`<button class="tab ${p===page?'active':''}" onclick="nav('${p}')"><span>${icon}</span>${label}</button>`).join('');document.getElementById('app').innerHTML=({home,food,gym,planner:mealPlan,inventory,ai:systemAI,body,settings})[page]();}render();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
